<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc">
  <title id="title">运动中不舒服要先停下求助</title>
  <desc id="desc">人物在运动中出现不适，另一位同学举手示意停止，并联系老师或120。</desc>
  <rect width="700" height="430" rx="28" fill="#fbeceb"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#263b32">
    <text x="30" y="42" font-size="25" font-weight="700" fill="#b45132">安全小故事 03</text>
    <text x="30" y="72" font-size="19" font-weight="700">运动时胸痛、晕厥、呼吸困难，还要坚持吗？</text>
    <text x="30" y="103" font-size="15" fill="#64706a">不用硬撑：先停下、找现场的人、必要时拨打120。</text>
  </g>

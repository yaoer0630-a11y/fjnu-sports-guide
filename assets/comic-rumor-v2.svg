    <path d="M543 274 L579 305 L628 265" fill="none" stroke="#176149" stroke-width="12"/>
  </g>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#263b32">
    <text x="52" y="369" font-size="17" fill="#b45132">传言：一律不行</text>
    <text x="391" y="369" font-size="17" fill="#176149">做法：查当年评审文件</text>
  </g>
</svg>
